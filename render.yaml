services:
  - type: web
    name: metroflow-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false         
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENSOR_INGEST_API_KEY
        sync: false
      - key: METRO_TRAIN_INGEST_API_KEY
        sync: false
      - key: PUBLIC_ADDRESS_WEBHOOK_URL
        sync: false
      - key: PUBLIC_ADDRESS_WEBHOOK_TOKEN
        sync: false
      - key: MOBILE_PUSH_WEBHOOK_URL
        sync: false
      - key: MOBILE_PUSH_WEBHOOK_TOKEN
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CACHE_ENABLED
        value: "false"
      - key: CACHE_TTL_SECONDS
        value: "30"
      - key: RATE_LIMIT_USE_REDIS
        value: "false"
      - key: AI_MODEL_LIGHT_MODE
        value: "true"
      - key: ENABLE_REPORT_SCHEDULER
        value: "true"
      - key: REPORT_SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: CROWD_DATA_STALE_AFTER_SECONDS
        value: "300"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "MetroFlow Alerts"
      - key: SMTP_USE_TLS
        value: "true"
